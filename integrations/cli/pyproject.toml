[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ploo-cli"
version = "0.1.0"
description = "Terminal entrypoint (ploo) for the Ploo hardware product workflow"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Ploo contributors" }]
keywords = ["ploo", "hardware", "design-pack", "cli"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
# The CLI is a thin dispatcher over core/scripts/, which is stdlib-only.
dependencies = []

[project.scripts]
ploo = "ploo_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
