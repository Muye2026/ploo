name: test

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m compileall -q core/scripts tests
      - run: python -m unittest discover -s tests -v
      - run: python core/scripts/validate_v2.py design-pack examples/v2-orchestrator-demo/design-pack.v2.json
      - run: python core/scripts/validate_v2.py electrical-pack examples/v2-orchestrator-demo/electrical-pack.v2.json
      - run: python core/scripts/validate_v2.py interface-control examples/v2-orchestrator-demo/interface-control.v2.json
      - run: python core/scripts/validate_v2.py run-state examples/v2-orchestrator-demo/run-state.v2.json
      - run: python core/scripts/validate_bundle.py --run-state examples/v2-orchestrator-demo/run-state.v2.json --design-pack examples/v2-orchestrator-demo/design-pack.v2.json --electrical-pack examples/v2-orchestrator-demo/electrical-pack.v2.json --interface-control examples/v2-orchestrator-demo/interface-control.v2.json
      - run: python core/scripts/evaluate_behavior_contracts.py --cases core/evals/product-loop-v2.jsonl --responses core/evals/product-loop-v2-golden-responses.jsonl
      - run: pip install -e integrations/cli
      - run: python -m unittest discover -s integrations/cli/tests -v
      - run: ploo --version
      - run: ploo validate design-pack examples/v2-orchestrator-demo/design-pack.v2.json
      - run: ploo run-state validate examples/v2-orchestrator-demo/run-state.v2.json
